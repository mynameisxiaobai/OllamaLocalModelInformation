const PULL_SUGGEST=['qwen3:8b','gemma3:4b','llama3.2:3b','deepseek-r1:7b','qwen2.5-coder:7b','nomic-embed-text'];
function confirmPull(){
  const body='<div class="warnbox acc">'+ICO.down+'<div>从 Ollama 官方仓库下载模型到本机。'+
    '大模型可能占用数十 GB 磁盘空间，耗时可达数十分钟。</div></div>'+
    '<div class="fld"><label for="pullIn">模型名称</label>'+
    '<input id="pullIn" placeholder="例如 qwen3:8b" autocomplete="off" spellcheck="false">'+
    '<div class="hint">等效命令：<code>ollama pull &lt;名称&gt;</code></div></div>'+
    '<div class="sugg">'+PULL_SUGGEST.map(s=>'<button data-sug="'+esc(s)+'">'+esc(s)+'</button>').join('')+'</div>';
  const foot='<button class="btn" data-cancel>取消</button>'+
    '<button class="btn pri" id="pullGo">开始下载</button>';
  const node=modalShell('acc',ICO.down,'拉取模型','从官方仓库下载新的模型文件。',body,foot);
  openModal(node);
  const inp=node.querySelector('#pullIn'), go=node.querySelector('#pullGo');
  const sync=()=>{ go.disabled=!inp.value.trim(); };
  inp.addEventListener('input',sync);
  node.querySelectorAll('[data-sug]').forEach(b=>b.addEventListener('click',()=>{
    inp.value=b.dataset.sug; sync(); inp.focus();
  }));
  node.querySelector('[data-cancel]').addEventListener('click',closeModal);
  const go2=async()=>{
    const name=inp.value.trim(); if(!name) return;
    body_progress(node,name);
    try{
      await doPull(node,name);
      closeModal();
      toast('ok','拉取完成：'+name,'新模型已加入本机列表');
      await loadData();
    }catch(e){
      if(e&&e.__abort) toast('warn','已中断下载',name+'（已下载的分片会保留，下次拉取可续传）');
      else toast('err','拉取失败：'+name,e&&e.message?e.message:String(e));
    }
  };
  go.addEventListener('click',go2);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&inp.value.trim()) go2(); });
}
function body_progress(node,name){
  const bd=node.querySelector('.mo-bd');
  bd.innerHTML='<dl class="kv">'+kv('模型',esc(name),'txt')+'</dl>'+
    '<div class="prog"><div class="pr-top"><span class="st" id="prSt">正在获取 manifest…</span>'+
    '<span class="pc" id="prPc"></span></div>'+
    '<div class="pr-track"><div class="pr-fill" id="prFill"></div></div>'+
    '<div class="pr-sub" id="prSub"></div></div><div id="prErr"></div>';
  const ft=node.querySelector('.mo-ft');
  ft.innerHTML='<button class="btn" id="prCancel">中断下载</button>';
  ft.querySelector('#prCancel').addEventListener('click',()=>{
    if(state.modal&&state.modal.ac) state.modal.ac.abort();
  });
}
async function doPull(node,name){
  const ac=new AbortController();
  state.modal={ac:ac,onClose:()=>{}};
  const st=node.querySelector('#prSt'), pc=node.querySelector('#prPc'),
        fill=node.querySelector('#prFill'), sub=node.querySelector('#prSub'),
        errBox=node.querySelector('#prErr');
  let lastPct=0, segs=0;
  try{
    for await(const d of API.pull(name,ac.signal)){
      if(d.error) throw new Error(d.error);
      const s=d.status||'';
      if(s==='pulling manifest'){ st.textContent='正在获取 manifest…'; fill.classList.add('ind'); }
      else if(s.indexOf('pulling')===0){
        fill.classList.remove('ind');
        const pct=d.total? Math.round(d.completed/d.total*100) : 0;
        if(pct>lastPct){ lastPct=pct; }
        st.textContent='正在下载分片';
        pc.textContent=(d.total? pct+'%' : '');
        fill.style.width=Math.max(pct,2)+'%';
        if(d.digest){
          sub.textContent='分片 '+(d.digest||'').slice(0,12)+
            (d.total?'  ·  '+fmt.bytes(d.completed).v+fmt.bytes(d.completed).u+' / '+
              fmt.bytes(d.total).v+fmt.bytes(d.total).u:'');
        }
        segs++;
      }
      else if(s.indexOf('verifying')===0){
        st.textContent='正在校验 SHA256 摘要…'; fill.classList.add('ind'); pc.textContent='';
        sub.textContent='分片 '+segs+' 个';
      }
      else if(s.indexOf('writing')===0){ st.textContent='正在写入 manifest…'; fill.classList.add('ind'); }
      else if(s==='success'){ st.textContent='下载完成'; fill.classList.add('ind'); fill.style.width='100%'; pc.textContent='100%'; }
      else st.textContent=s;
    }
    return true;
  }catch(e){
    if(ac.signal.aborted){ const a=new Error('aborted'); a.__abort=true; throw a; }
    if(errBox) errBox.innerHTML='<div class="pr-err">'+ICO.warn+' '+esc(e.message||String(e))+'</div>';
    throw e;
  }
}

    (desc?'<p>'+esc(desc)+'</p>':'');
  for(const c of cmds){
    h+='<div class="gc-cmd"><code>'+esc(c[0])+'</code>'+
       '<button data-cp="'+esc(c[0])+'" title="复制">'+ICO.copy+'</button></div>';
  }
  h+='</div>';
  return h;
}
function corsCards(){
  return gcCard('通过本地服务打开','推荐','本项目自带启动脚本，双击即可，无需改动 Ollama 设置。',[
    ['start-board.bat','双击此文件即可启动（自动选择可用端口）'],
    ['python -m http.server 5173 --bind 127.0.0.1','手动方式：然后访问 http://127.0.0.1:5173/ollama-model-board.html'],
    ['npx serve . -p 8080','或用 Node：然后访问 http://127.0.0.1:8080/ollama-model-board.html']
  ]) +
  gcCard('放行全部来源','一次性','写入环境变量后需完全退出并重启 Ollama 才生效。',[
    ['setx OLLAMA_ORIGINS "*"','以新开的环境运行 Ollama']
  ]) +
  gcCard('自检当前策略','','用于确认 Ollama 返回的跨域响应头。',[
    ['curl -X OPTIONS http://127.0.0.1:11434/api/version -H "Origin: null" -i',
     '预期看到 204 与 Access-Control-Allow-Origin；若为 403 则被拒绝']
  ]);
}
async function doCopy(name){
  const cmd='ollama run '+name;
  if(await copyText(cmd)) toast('ok','已复制命令',cmd);
  else toast('err','复制失败','请手动选中命令文本复制');
}

/* ==========================================================================
   16. 数据加载
   ========================================================================== */
async function loadData(){
  state.status='loading'; renderHeader();
  try{
    const v=await API.version();
    state.version=(v&&v.version)?v.version:null;
  }catch(e){
    const k=API.classifyError(e);
    if(k==='cors'){
      state.status='cors'; renderHeader();
      showGate('warn','浏览器跨域限制',
        '当前页面以 file:// 方式打开，浏览器发送的来源标识是 Origin: null，'+
        '而 Ollama 的跨域白名单不接受该来源，因此请求被拒绝。这不是配置错误，'+
        '改用本地 http 服务打开即可正常访问。',
        corsCards());
      return;
    }
    if(k==='timeout'){
      state.status='error'; renderHeader();
      showGate('err','连接超时',
        'Ollama 在 '+API.base+' 未在预期时间内响应，请确认服务状态后重试。',null);
      return;
    }
    state.status='error'; renderHeader();
    showGate('err','无法连接 Ollama',
      '未能连上 '+API.base+'。请确认 Ollama 正在运行；如未启动，可执行下面的命令。',
      gcCard('启动 Ollama 服务','',null,[
        ['ollama serve','前台启动服务'],
        ['ollama serve','若已安装为后台服务，检查托盘图标是否运行']
      ]));
    return;
  }
  hideGate();
  let tags, ps;
  try{ tags=await API.tags(); }catch(e){
    state.status='error'; renderHeader();
    showGate('err','读取模型列表失败',
      '已连接 Ollama '+(state.version||'')+'，但 /api/tags 返回错误：'+esc(e.message||String(e)),null);
    return;
  }
  try{ ps=await API.ps(); }catch(e){ ps={models:[]}; }

  const psMap={};
  (ps.models||[]).forEach(m=>{ psMap[m.name]=m; psMap[m.model]=m; });

  const prevNames=state.models.map(m=>m.name);
  const prevDigests={}; state.models.forEach(m=>{ prevDigests[m.name]=m.digest; });
  state.models=(tags.models||[]).map(t=>normalize(t,psMap));
  state.ps=ps;
  state.totalSize=state.models.reduce((a,m)=>a+m.size,0);
  state.newNames=new Set(state.models.filter(m=>!prevNames.includes(m.name)).map(m=>m.name));
  // digest 变化的模型，其实测数据已按 digest 键自动失效
  state.status='ready';
  await doBenchTick();
  renderAll();
  if(state.newNames.size) setTimeout(()=>{ state.newNames.clear(); renderAll(); },2400);
}

/* ==========================================================================
   17. 事件绑定
   ========================================================================== */
function bind(){
  // 顶栏
  $('#btnRefresh').addEventListener('click',()=>loadData());
  $('#btnPull').addEventListener('click',confirmPull);
  $('#btnCfg').addEventListener('click',confirmCfg);
  $('#btnBench').addEventListener('click',runBenchAll);
  $$('.seg button').forEach(b=>b.addEventListener('click',()=>{
    state.ui.view=b.dataset.view;
    store.set(LS.PREFS,{view:state.ui.view,sort:state.ui.sort});
    renderAll();
  }));
  // 搜索
  const q=$('#q'); let tmr=null;
  q.addEventListener('input',()=>{
    $('#searchWrap').classList.toggle('has',!!q.value);
    clearTimeout(tmr);
    tmr=setTimeout(()=>{ state.ui.q=q.value; renderAll(); },120);
  });
  $('#qClr').addEventListener('click',()=>{ q.value=''; state.ui.q=''; renderAll(); q.focus(); });
  $('#btnReset').addEventListener('click',resetFilters);

  // 内容区事件委托
  document.addEventListener('click',e=>{
    const o=e.target.closest('[data-open]');
    if(o){ openDrawer(o.dataset.open); return; }
    const b=e.target.closest('[data-bench]');
    if(b){ runBenchOne(b.dataset.bench); return; }
    const c=e.target.closest('[data-copy]');
    if(c){ doCopy(c.dataset.copy); return; }
    const d=e.target.closest('[data-del]');
    if(d){ confirmDelete(d.dataset.del); return; }
    const cp=e.target.closest('[data-cp]');
    if(cp){ copyText(cp.dataset.cp)
      .then(ok=>ok?toast('ok','已复制到剪贴板',cp.dataset.cp):toast('err','复制失败','请手动复制'));
      return; }
  });

  // 遮罩 / 键盘
  $('#scrim').addEventListener('click',()=>{ closeModal(); closeDrawer(); });
  $('#mroot').addEventListener('click',e=>{ if(e.target===$('#mroot')) closeModal(); });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if($('#mroot').classList.contains('on')) closeModal();
      else if($('#drawer').classList.contains('on')) closeDrawer();
    }
    if(e.key==='/'&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
      e.preventDefault(); $('#q').focus();
    }
  });
  window.addEventListener('resize',()=>{
    if(window.innerWidth<900&&$('#drawer').classList.contains('on')) closeDrawer();
  });
}

/* ==========================================================================
   18. 启动
   ========================================================================== */
function boot(){
  $('#btnRefresh').innerHTML=ICO.refresh;
  $('#qClr').innerHTML=ICO.x;
  $('#btnCfg').innerHTML=ICO.cog;
  $('#btnPull').innerHTML=ICO.down+' 拉取';
  $$('.seg button').forEach(b=>{
    b.innerHTML = b.dataset.view==='table' ? ICO.table+' 表格' : ICO.grid+' 卡片';
  });
  // 恢复偏好
  const p=store.get(LS.PREFS,null);
  if(p){
    if(p.view) state.ui.view=p.view;
    if(Array.isArray(p.sort)&&p.sort.length) state.ui.sort=p.sort;
  }
  // 恢复显卡配置
  const g=store.get(LS.GPU,null);
  state.gpu = (g&&g.vramGiB>0) ? g : { name:'', vramGiB:null };
  // 预取全部分类需要 show：仅为识别 capabilities 拉一次且并发受限
  bind();
  renderAll();
  loadData().then(prefetchMeta);
}
/* 渐进补齐 capabilities / context：并发 2，逐个失败静默 */
async function prefetchMeta(){
  const list=state.models;
  let i=0;
  const worker=async()=>{
    while(i<list.length){
      const m=list[i++];
      if(state.meta[m.name]) continue;
      try{
        const raw=await API.show(m.name);
        const mi=raw.model_info||{};
        state.meta[m.name]={
          loading:false,error:null, arch:extractArch(mi),
          caps:Array.isArray(raw.capabilities)?raw.capabilities:[],
          license:raw.license||'', quantMix:quantMix(raw.tensors),
          tensorCount:Array.isArray(raw.tensors)?raw.tensors.length:0, raw:{}
        };
      }catch(e){ state.meta[m.name]={loading:false,error:e.message||String(e)}; }
      renderAll();
    }
  };
  await Promise.all([worker(),worker()]);
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();

/* 暴露只读状态与纯函数，便于自动化验证与调试（不参与业务逻辑） */
window.__board=state;
window.__api={fmt,benchmarkFor,benchFor,headlineOf,extractArch,quantMix,
  paramToB,normalize,sel,isEmbedRow,
  kvCacheBytes,vramEstimate,vramSeries,fitLevel,fitMeta};
/* 渲染函数同样暴露，供自动化测试检查输出 HTML */
window.__view={vramTd,fitTd,benchTd,realTd,drawerShell,renderCards,renderTable,COLS};

})();
